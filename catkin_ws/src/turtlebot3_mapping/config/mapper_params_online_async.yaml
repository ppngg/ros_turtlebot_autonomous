slam_toolbox:
  ros__parameters:
    # Basic Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    map_topic: /map  # Explicitly set map topic name
    use_map_saver: true
    mode: mapping # localization or mapping
    
    # Resolution - 5cm per pixel
    resolution: 0.05
    
    # Map Update Parameters - more frequent updates for better mapping
    map_update_rate: 5.0
    map_publish_rate: 5.0  # Increased from 2.0 for more frequent map updates
    
    # Scan Matching Parameters
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    
    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    
    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    
    # Fine Search Parameters
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    
    # Minimum Travel Distance - reduced to start mapping sooner
    minimum_travel_distance: 0.2  # Reduced from 0.5 to start mapping earlier
    minimum_travel_heading: 0.2   # Reduced from 0.5 to start mapping earlier
    
    # Scan Subsampling
    scan_queue_size: 10
    
    # Occupancy Grid Parameters - larger map size for better coverage
    occupancy_grid_map_height: 50.0  # Increased from 20.0
    occupancy_grid_map_width: 50.0   # Increased from 20.0
    
    # Optimization Parameters
    enable_interactive_mode: false
    optimization_search_space_dimension: 0.5
    optimization_search_space_resolution: 0.01
    optimization_search_space_smear_deviation: 0.1

